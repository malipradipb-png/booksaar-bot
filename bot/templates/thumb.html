<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Thumb;src:url("{{FONT_THUMB}}");font-weight:400 800}
@font-face{font-family:Dev;src:url("{{FONT_DEV}}")}
@font-face{font-family:Serif;src:url("{{FONT_SERIF}}")}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:{{thumb_bg}};position:relative;font-family:Dev,sans-serif;--c1:{{cover1}};--c2:{{cover2}};--ink:{{ink}}}
{{BOOK_CSS}}
.photo{position:absolute;right:0;top:0;bottom:0;width:520px;background:url("{{photo}}") center/cover;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.words{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
 font-family:Thumb,Dev,sans-serif;font-weight:800;color:#fff;text-shadow:0 6px 16px rgba(0,0,0,.6);line-height:1.08;z-index:3}
.box{background:#FFE14A;color:#111;padding:0 26px;border-radius:14px;text-shadow:none;font-size:1.3em}
.brush{background:#E3262E;color:#fff;padding:4px 30px;transform:rotate(-2.5deg);clip-path:polygon(2% 8%,98% 0,100% 88%,4% 100%)}
/* A: big book on the left, words on the right */
.A .b3{--w:420px;--h:630px;--d:58px;left:44px;top:36px}
.A .words{left:540px;right:24px;font-size:100px}
/* B without photo: words left, big book right */
.B .b3{--w:400px;--h:600px;--d:56px;--ry:14deg;right:70px;top:50px}
.B .b3 .pages{left:calc(var(--d)/-2);transform:rotateY(-90deg)}
.B .words{left:24px;right:500px;font-size:96px}
/* B with photo: words left, book in the middle, person on the right */
.B.has-photo .b3{--w:330px;--h:495px;--d:48px;--ry:-14deg;right:auto;left:500px;top:150px}
.B.has-photo .b3 .pages{left:calc(var(--w) - var(--d)/2);transform:rotateY(90deg)}
.B.has-photo .words{left:16px;right:auto;width:480px;font-size:84px}
</style></head><body class="{{variant}}">
{{photo_div}}
{{BOOK}}
<div class="words">{{words}}</div>
{{FIT_JS}}
</body></html>
